<li class="shop-item{% if item.done %} is-done{% endif %}" data-id="{{ item.pk }}" data-fresh="{{ item.fresh_from }}">
  <form method="post" action="{% url 'shopping:toggle' item.pk %}">
    {% csrf_token %}
    <label class="check">
      <input type="hidden" name="done" value="0">
      <input type="checkbox" name="done" value="1"{% if item.done %} checked{% endif %} aria-label="{% if item.done %}Devolver {{ item.name }} a la lista{% else %}Marcar {{ item.name }} como comprado{% endif %}" onchange="this.form.requestSubmit()">
    </label>
  </form>
  <div class="shop-copy">
    {% if item.done %}
    <span class="shop-name">{{ item.name }}</span>
    {% else %}
    <button type="button" class="shop-name" aria-label="Editar {{ item.name }}">{{ item.name }}</button>
    {% endif %}
    {% if item.fresh_from %}
    <span class="shop-who">{{ item.fresh_from }} lo añadió ahora</span>
    {% endif %}
  </div>
  {% if not item.done %}
  <button type="button" class="shop-handle" aria-label="Mover {{ item.name }}">{% include "includes/icon.html" with name="grip" %}</button>
  {% endif %}
</li>
