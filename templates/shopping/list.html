{% extends "base.html" %}
{% block title %}Lista de compra · Nuestro Menú{% endblock %}
{% block content %}
<div class="page-head page-head-stack">
  <div>
    <h1>Lista de compra</h1>
    <p class="lede" id="shop-pending"{% if not pending_label %} hidden{% endif %}>{{ pending_label }}</p>
    <p class="shop-sync" id="shop-viewers"{% if not viewers %} hidden{% endif %}>{{ viewers }}</p>
  </div>
</div>

<form class="shop-add" method="post" action="{% url 'shopping:add' %}">
  {% csrf_token %}
  <label for="{{ form.name.id_for_label }}">Qué falta</label>
  {{ form.name }}
  {{ form.name.errors }}
  <button class="button" type="submit">Añadir</button>
</form>

<div id="shop-live" data-revision="{{ revision }}" data-fragment="{% url 'shopping:fragment' %}">
  {% include "shopping/live.html" %}
</div>
{% endblock %}
