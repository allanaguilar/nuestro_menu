{% extends "base.html" %}
{% block content %}
<section class="auth-card">
  <h1>Nueva contraseña</h1>
  {% if validlink %}
  <form method="post" hx-boost="false">
    {% csrf_token %}
    {{ form.as_p }}
    <div class="auth-actions">
      <button class="button" type="submit">Guardar</button>
    </div>
  </form>
  {% else %}
  <p>El enlace no es válido o ha caducado.</p>
  {% endif %}
</section>
{% endblock %}
