{% extends "base.html" %}
{% block content %}
<section class="auth-card">
  <h1>Nueva contraseña</h1>
  {% if validlink %}
  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button class="button" type="submit">Guardar</button>
  </form>
  {% else %}
  <p>El enlace no es válido o ha caducado.</p>
  {% endif %}
</section>
{% endblock %}
