{% extends "base.html" %}
{% block title %}Editar {{ food.name }}{% endblock %}
{% block content %}
<div class="page-head">
  <div>
    <h1>Editar alimento</h1>
    <p class="lede">{{ food.name }}</p>
  </div>
</div>
<form method="post" class="panel">
  {% csrf_token %}
  {{ form.as_p }}
  <div class="baby-form-actions">
    <button class="button" type="submit">Guardar cambios</button>
    <a class="button button-secondary" href="{% url 'baby:foods' %}">Cancelar</a>
  </div>
</form>
{% endblock %}
